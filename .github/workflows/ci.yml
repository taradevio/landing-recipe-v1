name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run check
      - run: bun test
      - run: bun run build
      - name: Validate production content
        if: github.ref == 'refs/heads/main'
        run: bun run validate:release
